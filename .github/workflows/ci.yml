name: Retail AI Agents CI & Staging Check

on:
  push:
    branches: [ "main", "foundation/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-stage:
    runs-on: ubuntu-latest
    env:
      TZ: Africa/Cairo
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest tzdata requests

      - name: Run full unit and integration test suite
        run: python -m pytest -v

      - name: Run one-command staging deployment & smoke check
        run: python -m foundation.staging_deploy --verify-only
